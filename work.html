<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Layout</title>
    <link rel="stylesheet" href="hard.css">
</head>
<body>

    <!-- MAIN WRAPPER holds both divs side by side -->
    <div class="main-wrapper">

        <!-- DIV 1: Left section with the cross layout -->
        <div class="left-section">

            <!-- Row 1: image 1 in middle column -->
            <div class="empty"></div>
            <div class="box">
                <img src="./assets/logo.svg" alt="image 1">
            </div>
            <div class="empty"></div>

            <!-- Row 2: image 3, logo, image 2 -->
            <div class="box">
                <img src="./assets/G1.svg" alt="image 3">
            </div>
            <div class="box">
                <img src="./assets/G2.svg" alt="logo">
            </div>
            <div class="box">
                <img src="./assets/G3.svg" alt="image 2">
            </div>

            <!-- Row 3: image 4 in middle column -->
            <div class="empty"></div>
            <div class="box">
                <img src="./assets/G4.svg" alt="image 4">
            </div>
            <div class="empty"></div>

        </div>

        <!-- DIV 2: Right section - Hero page -->
        <div class="right-section">
            <img src="./assets/Illustration.svg" alt="Hero Image">
        </div>

    </div>

</body>
</html>
